name: Release

# Builds the NSIS installer on a runner and, when SignPath is configured, has it Authenticode-signed
# before it leaves CI. SignPath Foundation attests that the binary was produced from this public
# repository, which is why packaging cannot stay on a development machine.
#
# This workflow deliberately does NOT create or publish the GitHub release: it uploads artefacts and
# stops there. Publishing stays a manual, deliberate act — see docs/releasing.md.

# Manual only. `tauri build` writes the updater signature, so it needs TAURI_SIGNING_PRIVATE_KEY as
# a repository secret; without it the job would die at the very end of the Rust build. Fired on
# every `v*` tag it would hang a permanent red check beside each release until the secret exists —
# which is how a genuine failure gets ignored. Restore the tag trigger once the secret is set:
#
#   push:
#     tags: ['v*']
on:
  workflow_dispatch:

# `actions: read` is required by the SignPath action to read the job and download its artefact.
permissions:
  actions: read
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  installer:
    name: NSIS installer
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      # Fails in seconds instead of after the whole Rust build.
      - name: Check the updater signing key
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw 'Repository secret TAURI_SIGNING_PRIVATE_KEY is missing (docs/releasing.md).'
          }

      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile

      # Run from a tag, the tag must be the version the three manifests carry: the updater URL in
      # latest.json is built from package.json, never from the ref.
      - name: Check the tag matches the version
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match package.json version $version"
          }

      # build.ps1 downloads mpv, yt-dlp and deno first (scripts/install-tools.ps1): tools/ is not
      # versioned. GITHUB_TOKEN only lifts the GitHub API rate limit of the shared runner IPs.
      - name: Build the installer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # The key pair carries no password. An empty value may not survive into the Windows
          # PowerShell 5.1 that runs build.ps1, so build.ps1 re-creates it for `tauri build`;
          # without it the CLI waits for a password on stdin and the job hangs to the timeout.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: pnpm package

      - name: Upload the unsigned installer
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: netsucast-installer-unsigned
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

      # Skipped until the repository variables exist, so the workflow stays usable before the
      # SignPath Foundation application is accepted. It then produces an unsigned installer, exactly
      # like a local `pnpm package`.
      - name: Authenticode signature (SignPath)
        id: signpath
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: src-tauri/target/release/bundle/nsis

      # Authenticode rewrites the bytes of the .exe, so the minisign signature `tauri build` wrote
      # over the unsigned file no longer matches it. Left as is, EVERY user's updater would reject
      # the release. It is regenerated here, on the signed installer, before the manifest reads it
      # back from disk. Bash on purpose: it is the shell that reliably passes an EMPTY password
      # variable to a Windows process (PowerShell 5.1 deletes a variable assigned '').
      - name: Regenerate the updater signature over the signed installer
        if: steps.signpath.outcome == 'success'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          export TAURI_SIGNING_PRIVATE_KEY_PASSWORD=''
          exe=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe | head -n 1)
          pnpm tauri signer sign "$exe" < /dev/null

      - name: Updater manifest
        run: pnpm update:manifest

      - name: SHA-256 of the installer
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe |
            ForEach-Object { "$($_.Name)  $((Get-FileHash $_.FullName -Algorithm SHA256).Hash)" } |
            Tee-Object -FilePath sha256.txt

      # VERSIONS.txt names the exact mpv / yt-dlp / deno builds inside the installer: the mpv
      # commit is what the GPL source offer of the release points to (docs/licensing.md).
      - name: Upload the release artefacts
        uses: actions/upload-artifact@v4
        with:
          name: netsucast-release
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe.sig
            src-tauri/target/release/bundle/nsis/latest.json
            src-tauri/resources/tools/mpv/VERSIONS.txt
            sha256.txt
          if-no-files-found: error
