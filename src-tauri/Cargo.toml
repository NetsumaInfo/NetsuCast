[package]
name = "netsucast"
version = "0.1.0"
description = "NetsuCast — video player that continues browser videos with real-time ArtCNN upscaling on the GPU"
authors = ["Netsuma"]
license = "AGPL-3.0-only"
repository = "https://github.com/NetsumaInfo/NetsuCast"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "netsucast_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-mpv = "0.5.2"
tiny_http = "0.12.0"
# In-app updates: latest.json from the GitHub releases, minisign-verified against the public key in
# tauri.conf.json. The NSIS installer relaunches the app itself after an update.
tauri-plugin-updater = "2"
# A downloaded update is checked again before it runs at the next launch (staged_update.rs).
minisign-verify = "0.2"
base64 = "0.22"
semver = "1"
tauri-plugin-autostart = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

# DXGI: which graphics card mpv renders on (automatic model choice); job objects: mpv ends
# with NetsuCast (child_job.rs). Same version Tauri uses.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Graphics_Dxgi", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
