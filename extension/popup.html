<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>NetsuCast</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <!-- Text comes from _locales via data-i18n (filled by popup.js); the French here is the fallback. -->
    <header>
      <h1 translate="no">Netsu<span>Cast</span></h1>
      <span id="status" class="status">…</span>
    </header>

    <div class="segmented tabs" role="tablist">
      <button id="tab-cast" type="button" role="tab" aria-selected="true" aria-controls="main" data-i18n="tabCast">Caster</button>
      <button id="tab-settings" type="button" role="tab" aria-selected="false" aria-controls="settings" data-i18n="setTitle">Paramètres</button>
    </div>

    <section id="settings" hidden>
      <div id="settings-list"></div>
    </section>

    <div id="main">
    <section>
      <button id="send-page" class="primary" data-i18n="popupSendPage">Caster la page</button>
      <p id="page-hint" class="hint"></p>
    </section>

    <section>
      <h2><span data-i18n="popupStreamsTitle">Flux détectés</span> <span id="count"></span></h2>
      <ul id="streams"></ul>
      <p id="empty" class="hint" data-i18n="popupEmpty" hidden>Aucun flux détecté. Lance la vidéo dans la page, puis rouvre ce menu.</p>
    </section>

    </div>

    <footer>
      <span id="message" role="status"></span>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
