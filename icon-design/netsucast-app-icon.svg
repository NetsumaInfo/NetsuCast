<!-- NetsuCast application icon. Transparent, cropped square around the drawing (viewBox), rendered at 1024. The Netsu mascot (shapes unchanged, scale 1.875) inside a neon screen whose bottom-left corner is open for the cast mark: a yellow dot r 26 and one arc r 82, every gap 36, every stroke 40. Mark inside the Android safe circle (r 313). -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="226 228 572 572" width="1024" height="1024">
<defs>
<linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#10203a"/><stop offset="1" stop-color="#050912"/></linearGradient>
<filter id="halo" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024"><feGaussianBlur stdDeviation="6"/></filter>

    <filter id="blur-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
    <filter id="blur-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
    <linearGradient id="cap-shine-l" x1="0.9" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.66" stop-color="#ffffff"/>
      <stop offset="0.76" stop-color="#22e2ee"/>
    </linearGradient>
    <linearGradient id="cap-shine-r" x1="0.1" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.66" stop-color="#ffffff"/>
      <stop offset="0.76" stop-color="#22e2ee"/>
    </linearGradient>
    <clipPath id="face-clip">
      <path d="M44 180 C44 118 88 104 122 104 C156 104 200 118 200 180 L200 196 L44 196 Z"/>
    </clipPath>
  
<g id="mascot" transform="translate(-1 -2.5)" stroke-linejoin="round" stroke-linecap="round">
    <!-- glow: cyan rim and soft halo, removable -->
    <g id="glow" fill="#02e3f0" stroke="#02e3f0">
      <g filter="url(#blur-glow)" opacity="0.4">
        <use xlink:href="#hair-shape" stroke-width="24"/>
        <use xlink:href="#visor-shape" stroke-width="18"/>
        <use xlink:href="#ear-l-cap" stroke-width="18"/>
        <use xlink:href="#ear-r-cap" stroke-width="18"/>
      </g>
      <use xlink:href="#hair-shape" stroke-width="19"/>
      <use xlink:href="#visor-shape" stroke-width="12.5"/>
      <use xlink:href="#ear-l-cap" stroke-width="13"/>
      <use xlink:href="#ear-r-cap" stroke-width="13"/>
    </g>
    <!-- sticker outline behind every part -->
    <g fill="#03070c" stroke="#03070c">
      <use xlink:href="#hair-shape" stroke-width="14"/>
      <use xlink:href="#visor-shape" stroke-width="8"/>
      <use xlink:href="#ear-l-cap" stroke-width="8.5"/>
      <use xlink:href="#ear-r-cap" stroke-width="8.5"/>
    </g>
    <!-- headphones: the right one mirrors the left around x = 122.25 -->
    <g id="ear-l" stroke="#03070c" stroke-width="5.5">
      <path d="M18 164 L20 152 L30.5 147.5 L30.5 158 Z" fill="#03070c"/>
      <path d="M29.75 157 L33 150 L41 150 L49 162 L49 176 L44.5 176 L44.5 203 L29.75 198.5 Z" fill="#cdcbcc"/>
      <path d="M33.5 157 L36 153 L40 153 L36.5 160 Z" fill="#eceaeb" stroke="none"/>
      <path id="ear-l-cap" d="M29.75 157 L23 158.5 L18.5 165 L18.5 184 L22.5 190 L29.75 192 Z" fill="url(#cap-shine-l)"/>
    </g>
    <g id="ear-r" stroke="#03070c" stroke-width="5.5">
      <path d="M214.75 157 L211.5 150 L203.5 150 L195.5 162 L195.5 176 L200 176 L200 203 L214.75 198.5 Z" fill="#cdcbcc"/>
      <path d="M211 157 L208.5 153 L204.5 153 L208 160 Z" fill="#eceaeb" stroke="none"/>
      <path id="ear-r-cap" d="M214.75 157 L221.5 158.5 L226 165 L226 184 L222 190 L214.75 192 Z" fill="url(#cap-shine-r)"/>
    </g>
    <!-- face -->
    <g id="face">
      <path d="M44 180 C44 118 88 104 122 104 C156 104 200 118 200 180 L200 196 L44 196 Z" fill="#fdecce"/>
      <g clip-path="url(#face-clip)">
        <use xlink:href="#hair-shape" fill="none" stroke="#f7cf9f" stroke-width="22" filter="url(#blur-soft)"/>
      </g>
      <path d="M48 159 C47.5 167 48.5 174 51 180 M196.5 159 C197 167 196 174 193.5 180" fill="none" stroke="#03070c" stroke-width="8.5"/>
    </g>
    <!-- eyes: whites with a thin warm rim, opaque pupils with a catch-light -->
    <g id="eye-l">
      <ellipse cx="84.5" cy="171.5" rx="26" ry="28" fill="#ffffff" filter="url(#blur-soft)" opacity="0.8"/>
      <ellipse cx="84.5" cy="171.5" rx="24.5" ry="26.5" fill="#ffffff" stroke="#efd3b0" stroke-width="1.2"/>
    </g>
    <g id="eye-r">
      <ellipse cx="160" cy="171.5" rx="26" ry="28" fill="#ffffff" filter="url(#blur-soft)" opacity="0.8"/>
      <ellipse cx="160" cy="171.5" rx="24.5" ry="26.5" fill="#ffffff" stroke="#efd3b0" stroke-width="1.2"/>
    </g>
    <g id="pupil-l">
      <circle cx="87.5" cy="169.75" r="14.6" fill="#03070c"/>
      <circle cx="92.5" cy="164" r="3.6" fill="#ffffff"/>
    </g>
    <g id="pupil-r">
      <circle cx="157" cy="169.75" r="14.6" fill="#03070c"/>
      <circle cx="162" cy="164" r="3.6" fill="#ffffff"/>
    </g>
    <!-- visor: symmetric around x = 122.25 -->
    <g id="visor" fill="#cdcbcc" stroke="#03070c" stroke-width="6">
      <path id="visor-shape" d="M44.5 176.5 C49 177 53 183 58 187.5 C63 192 72 194.25 84 194.25 L160.5 194.25 C172.5 194.25 181.5 192 186.5 187.5 C191.5 183 195.5 177 200 176.5 L200 205 C192.5 216 176.5 226.5 160.5 231 C145 234 99.5 234 84 231 C68 226.5 52 216 44.5 205 Z"/>
      <path d="M64 200 C82 200.5 162.5 200.5 180.5 200" fill="none" stroke="#e2e0e0" stroke-width="2.5"/>
      <path d="M52 204 Q60 213.5 76 218" fill="none" stroke="#f4f3f3" stroke-width="3"/>
      <path d="M192.5 204 Q184.5 213.5 168.5 218" fill="none" stroke="#f4f3f3" stroke-width="3"/>
    </g>
    <path id="mouth" d="M86.5 222 L109.5 222 L116 209.25 L128.5 209.25 L135 222 L158 222" fill="none" stroke="#03070c" stroke-width="4"/>
    <!-- hair -->
    <g id="hair" fill="#00d2e5" stroke="#03070c" stroke-width="12" paint-order="stroke">
      <path id="hair-shape"
        d="M13 89 Q35 76 57.5 85.5 Q54.5 70 56.5 55.5 Q77.5 61 90 71 Q82.25 48 93.5 25 Q128.5 35.25 145.5 64.5 Q166.75 38.5 201 40.5 C199 60 184 74 189 85 Q213 76 236.5 83.5 Q221.25 101.75 213 109 Q226 114.5 237 123 Q222 133 207 137 L203.5 132.5 Q200 146 196.5 159 C192 145 172 120 155.5 109 C149 122 136 142 120.5 156.5 C104 142 94.5 123 92 117 C78 124 56 140 48 163 Q44 152 42 141 Q30 143.5 22 135.5 Q30 127 37 122.5 Q13 106.25 13 89 Z"/>
      <path d="M92 115 L84 127 Q89 130.5 96 127 Z M155.5 107 L151 122 Q157 125 162.5 120 Z M114 155 Q120.5 168 127 155 Z" fill="#03070c" stroke="none"/>
      <!-- strands: one style, tapered, same width -->
      <g fill="#0890a1" stroke="#0890a1" stroke-width="1.4">
        <path d="M23 91 Q21.7 110.1 43 116 Q28.3 104.9 23 91 Z"/>
        <path d="M104 38 Q130.7 43.3 141 83 Q124.3 48.7 104 38 Z"/>
        <path d="M140 83 Q157 46.6 190 46 Q162 53.4 140 83 Z"/>
        <path d="M190 46 Q189.9 69.6 173 88 Q182.1 66.4 190 46 Z"/>
        <path d="M185 96 Q200.5 84.9 219 88 Q202.5 93.1 185 96 Z"/>
      </g>
    </g>
  </g>
</defs>

<path d="M264 550.8V460A148 148 0 0 1 412 312H612A148 148 0 0 1 760 460V604A148 148 0 0 1 612 752H465.2" fill="none" stroke="#02e3f0" stroke-width="60" opacity="0.32" filter="url(#halo)" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M264 550.8V460A148 148 0 0 1 412 312H612A148 148 0 0 1 760 460V604A148 148 0 0 1 612 752H465.2" fill="none" stroke="#02e3f0" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>

<path d="M316 618A82 82 0 0 1 398 700" fill="none" stroke="#02e3f0" stroke-width="60" opacity="0.32" filter="url(#halo)" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M316 618A82 82 0 0 1 398 700" fill="none" stroke="#02e3f0" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="316" cy="700" r="26" fill="#ffd23d" stroke="#03070c" stroke-width="0"/>
<use xlink:href="#mascot" transform="translate(323.66 217.88) scale(1.875)"/>
</svg>
